[project]
name = "ci-gate-wrapper"
version = "0.1.0"
description = "CDMAE enforcement layer — CI gate chain for agentic development"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "anthropic>=0.40.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

# ── Ruff ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "T20",  # flake8-print (flag print statements)
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "T201",  # allow print() — gate services use print for logging
    "S603",  # subprocess without shell=True is intentional
    "S607",  # partial executable path in subprocess — gates invoke CLI tools by name
    "S104",  # binding to 0.0.0.0 is intentional for local dev services
    "S105",  # GateStatus.PASS is not a password
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"gates/__init__.py" = ["N999"]
"tests/**" = ["S101", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["gates", "orchestrator", "hooks", "scripts", "memory"]

# ── Mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["uvicorn", "httpx", "anthropic", "cryptography", "cryptography.*"]
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q --cov=gates --cov=orchestrator --cov=memory --cov-report=term-missing"

# ── Bandit ───────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404"]  # import_subprocess — we use subprocess intentionally
